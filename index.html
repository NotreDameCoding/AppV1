  <script>
    /* before first paint: remembered theme (light unless chosen), and hide animated bits only if the motion script can run */
    try { if (localStorage.getItem("ndc.theme") === "dark") document.documentElement.dataset.theme = "dark"; } catch (e) {}
    if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      document.documentElement.classList.add("m-pending");
      setTimeout(function () { document.documentElement.classList.remove("m-pending"); }, 3500);
    }
  </script>
